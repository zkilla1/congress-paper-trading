services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://trading:trading@db:5432/trading
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
